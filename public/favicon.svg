<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="dd-gradient-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="dd-gradient-inner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="dd-glass-reflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with subtle glass shadow -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#0B1118" />
  <rect x="2" y="2" width="44" height="44" rx="12" stroke="url(#dd-gradient-primary)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer D loop (Dues: structured capital obligation) -->
  <path
    d="M11 11C11 9.89543 11.8954 9 13 9H23.5C31.5081 9 38 15.4919 38 23.5C38 31.5081 31.5081 38 23.5 38H13C11.8954 38 11 37.1046 11 36V11Z"
    fill="url(#dd-gradient-primary)"
  />

  <!-- Negative Space Glass Cavity -->
  <path
    d="M17 15H23C27.6944 15 31.5 18.8056 31.5 23.5C31.5 28.1944 27.6944 32 23 32H17V15Z"
    fill="#0B1118"
  />

  <!-- Inner Dynamic D Ribbon (Dock: safe harbor flow and liquidity) -->
  <path
    d="M17 18H22C25.0376 18 27.5 20.4624 27.5 23.5C27.5 26.5376 25.0376 29 22 29H17V18Z"
    fill="url(#dd-gradient-inner)"
  />

  <!-- Central Settlement Pulse Node -->
  <circle cx="21" cy="23.5" r="2.2" fill="#FFFFFF" />

  <!-- Specular Glass Highlight -->
  <path
    d="M13 9.5H23.5C31.232 9.5 37.5 15.768 37.5 23.5C37.5 23.8 37.49 24.1 37.47 24.4C36.95 16.5 30.8 10.3 23 10.3H13C12.1 10.3 11.4 10.8 11.2 11.6C11.1 10.5 11.9 9.5 13 9.5Z"
    fill="url(#dd-glass-reflect)"
  />
</svg>
